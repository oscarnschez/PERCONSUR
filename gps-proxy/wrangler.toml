# Configuración para desplegar con la terminal (opcional): npx wrangler deploy
# Los secretos NO van aquí: npx wrangler secret put IOP_APPID | IOP_SECRET | PCS_KEY
name = "perconsur-gps"
main = "worker.js"
compatibility_date = "2025-09-01"

[vars]
ALLOWED_ORIGIN = "https://oscarnschez.github.io"

# Opcional: bloqueos por intentos compartidos entre instancias (ver README → Límite de intentos)
# [[kv_namespaces]]
# binding = "LIMITS"
# id = "<id del espacio KV perconsur-limites>"

# Rastreo para clientes: espacio KV de los enlaces (ver README → Rastreo para clientes)
# [[kv_namespaces]]
# binding = "TRACKING"
# id = "<id del espacio KV perconsur-rastreo>"
